# Symlink Configuration
# Format: SOURCE:DESTINATION
# SOURCE is relative to configs/ directory
# DESTINATION supports $HOME and $XDG_CONFIG_HOME variables

# Zsh
zsh/.zshrc:$HOME/.zshrc
zsh/.aliases:$HOME/.aliases
zsh/.exports:$HOME/.exports
zsh/.functions:$HOME/.functions

# Tmux
tmux/tmux.conf:$XDG_CONFIG_HOME/tmux/tmux.conf

# Neovim
nvim:$XDG_CONFIG_HOME/nvim

# Ghostty
ghostty:$XDG_CONFIG_HOME/ghostty

# Direnv
direnv:$XDG_CONFIG_HOME/direnv

# Starship
starship/starship.toml:$XDG_CONFIG_HOME/starship.toml

# Lazygit
lazygit/config.yml:$HOME/Library/Application Support/lazygit/config.yml

# Zed
zed/keymap.json:$XDG_CONFIG_HOME/zed/keymap.json
zed/settings.json:$XDG_CONFIG_HOME/zed/settings.json
